<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填写企业信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-right: 15px;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: normal;
            flex: 1;
            text-align: center;
            margin-right: 33px;
        }
        
        .container {
            background: white;
            min-height: calc(100vh - 70px);
        }
        
        .form-section {
            padding: 30px 20px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 16px;
            color: #333;
        }
        
        .required {
            color: #e53e3e;
            margin-left: 5px;
        }
        

        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafa;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: white;
        }
        
        .form-input::placeholder {
            color: #999;
        }
        
        .code-description {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .warning-section {
            background-color: #fffbeb;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 15px;
            margin: 30px 20px;
            display: flex;
            align-items: flex-start;
        }
        
        .warning-icon {
            color: #f59e0b;
            margin-right: 8px;
            font-size: 16px;
            margin-top: 2px;
        }
        
        .warning-text {
            color: #92400e;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .submit-btn {
            margin: 30px 20px 20px;
            padding: 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            width: calc(100% - 40px);
            cursor: pointer;
        }
        
        .submit-btn.active {
            background-color: #3b82f6;
            cursor: pointer;
        }

        .contact-btn {
            display: block;
            margin: 10px 20px 20px;
            padding: 15px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            width: calc(100% - 40px);
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .contact-btn:hover {
            background-color: #2563eb;
            color: white;
            text-decoration: none;
        }

        .contact-btn i {
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="header-title">填写企业信息</div>
    </div>
    
    <div class="container">
        <div class="form-section">
            <div style="width:100%;height:500px;" data-fillout-id="u4C99MieGhus" data-fillout-embed-type="standard" data-fillout-inherit-parameters data-fillout-dynamic-resize></div>
            <script src="https://server.fillout.com/embed/v1/"></script>
        </div>
        
        <div class="warning-section">
            <div class="warning-icon">⚠️</div>
            <div class="warning-text">请确保信息准确，提交后将立即开始处理</div>
        </div>
        
        <button class="submit-btn" id="submitBtn" onclick="submitForm()">确认信息并支付</button>

        <a href="https://work.weixin.qq.com/ca/cawcdeac58029da582" target="_blank" class="contact-btn">
            <i class="fas fa-comments"></i>
            立即联系
        </a>
    </div>
    
    <script>
        const submitBtn = document.getElementById('submitBtn');
        
        function goBack() {
            window.location.href = 'index.html';
        }
        
        async function submitForm() {
            // 显示提交状态
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            submitBtn.style.background = '#ccc';
            
            // 获取选择的服务信息
            const selectedService = localStorage.getItem('selectedService') || '年报申报';
            const selectedPrice = parseInt(localStorage.getItem('selectedPrice')) || 130;
            
            // 收集表单数据 (现在使用 Fillout，数据由 Fillout 处理)
            const formData = {
                selectedService: selectedService,
                selectedPrice: selectedPrice,
                formType: 'fillout'  // 标记这是 fillout 表单
            };
            
            // 生成订单号
            const orderId = 'ORD' + Date.now() + Math.random().toString(36).substr(2, 4).toUpperCase();
            
            // 创建订单数据
            const orderData = {
                orderId: orderId,
                ...formData,
                paymentStatus: 'pending',
                paymentMethod: null,
                createTime: new Date().toISOString(),
                paymentTime: null
            };
            
            // 保存表单数据和订单数据
            localStorage.setItem('formData', JSON.stringify(formData));
            localStorage.setItem('currentOrderId', orderId);
            localStorage.setItem(`order_${orderId}`, JSON.stringify(orderData));
            
            // 模拟提交延迟
            setTimeout(() => {
                // 跳转到支付页面
                window.location.href = 'payment.html';
            }, 1500);
        }
        
        // 页面加载时检查是否有保存的数据
        window.onload = function() {
            // 如果没有选择服务，默认设置为年报申报
            if (!localStorage.getItem('selectedService')) {
                localStorage.setItem('selectedService', '年报申报');
                localStorage.setItem('selectedPrice', '130');
            }
        };
    </script>
</body>
</html>
