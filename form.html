<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填写企业信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-right: 15px;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: normal;
            flex: 1;
            text-align: center;
            margin-right: 33px;
        }
        
        .container {
            background: white;
            min-height: calc(100vh - 70px);
        }
        
        .form-section {
            padding: 30px 20px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 16px;
            color: #333;
        }
        
        .required {
            color: #28a745;
            margin-left: 5px;
        }
        

        
        .form-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafa;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: white;
        }
        
        .form-input::placeholder {
            color: #999;
        }
        
        .code-description {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        .warning-section {
            background-color: #fffbeb;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 15px;
            margin: 30px 20px;
            display: flex;
            align-items: flex-start;
        }
        
        .warning-icon {
            color: #f59e0b;
            margin-right: 8px;
            font-size: 16px;
            margin-top: 2px;
        }
        
        .warning-text {
            color: #92400e;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .submit-btn {
            margin: 30px 20px 20px;
            padding: 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            width: calc(100% - 40px);
            cursor: pointer;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .submit-btn.active {
            background-color: #3b82f6;
            cursor: pointer;
        }

        .contact-btn {
            display: block;
            margin: 10px 20px 20px;
            padding: 15px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            width: calc(100% - 40px);
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .contact-btn:hover {
            background-color: #2563eb;
            color: white;
            text-decoration: none;
        }

        .contact-btn i {
            margin-right: 8px;
        }

        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 14px;
        }

        .success-message {
            background-color: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 14px;
        }

        /* 公司信息样式 */
        .company-info {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            display: flex;
            align-items: center;
            font-weight: 600;
            color: #374151;
            min-width: 100px;
            margin-right: 15px;
        }

        .info-label i {
            margin-right: 8px;
            color: #3b82f6;
            font-size: 16px;
        }

        .info-content {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.5;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="header-title">填写企业信息</div>
    </div>
    
    <div class="container">
        <div class="form-section">
            <form id="enterpriseForm">
                <div class="form-group">
                    <div class="form-label">
                        企业名称 <span class="required">*</span>
                    </div>
                    <input type="text" class="form-input" id="companyName" name="companyName" placeholder="请输入企业全称" required>
                </div>

                <div class="form-group">
                    <div class="form-label">
                        统一社会信用代码 <span class="required">*</span>
                    </div>
                    <input type="text" class="form-input" id="socialCreditCode" name="socialCreditCode" placeholder="请输入18位统一社会信用代码" required maxlength="18">
                    <div class="code-description">统一社会信用代码由18位阿拉伯数字或大写英文字母组成</div>
                </div>

                <div class="form-group">
                    <div class="form-label">
                        法人姓名 <span class="required">*</span>
                    </div>
                    <input type="text" class="form-input" id="legalPersonName" name="legalPersonName" placeholder="请输入法定代表人姓名" required>
                </div>

                <div class="form-group">
                    <div class="form-label">
                        联系电话 <span class="required">*</span>
                    </div>
                    <input type="tel" class="form-input" id="contactPhone" name="contactPhone" placeholder="请输入联系电话" required>
                </div>

                <!-- 公司信息 -->
                <div class="company-info">
                    <div class="info-item">
                        <div class="info-label">
                            <i class="fas fa-map-marker-alt"></i>
                            公司地址
                        </div>
                        <div class="info-content">江苏省无锡市新吴区人民来访综治中心28-6号</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">
                            <i class="fas fa-clock"></i>
                            工作时间
                        </div>
                        <div class="info-content">8:30 - 17:00</div>
                    </div>
                </div>

                <div id="messageContainer"></div>
            </form>
        </div>
        
        <div class="warning-section">
            <div class="warning-icon">⚠️</div>
            <div class="warning-text">请确保信息准确，提交后将立即开始处理</div>
        </div>
        
        <button class="submit-btn" id="submitBtn" onclick="submitForm()">确认信息并支付</button>

        <a href="https://work.weixin.qq.com/ca/cawcdeac58029da582" target="_blank" class="contact-btn">
            <i class="fas fa-comments"></i>
            立即联系
        </a>
    </div>

    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 使用IIFE避免全局变量冲突，保护聊天组件
        (function() {
            // Supabase 配置 - 代账业务项目
            const SUPABASE_URL = 'https://mtotipilbjlkducccnko.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_hI-vAHNFQpWeyUR0O3-_0Q_JeqQ7qWH';

            let supabaseClient = null;

            // 初始化Supabase
            if (typeof window.supabase !== 'undefined') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else {
                console.error('Supabase库未加载');
            }

            const submitBtn = document.getElementById('submitBtn');
            const messageContainer = document.getElementById('messageContainer');

            function showMessage(message, isError = false) {
                if (messageContainer) {
                    messageContainer.innerHTML = `
                        <div class="${isError ? 'error-message' : 'success-message'}">
                            ${message}
                        </div>
                    `;
                }
            }

            // 暴露goBack到全局作用域
            window.goBack = function() {
                window.location.href = 'index.html';
            };

            // 暴露submitForm到全局作用域
            window.submitForm = async function() {
                // 获取表单数据
                const form = document.getElementById('enterpriseForm');
                const formData = new FormData(form);

                const companyName = formData.get('companyName').trim();
                const socialCreditCode = formData.get('socialCreditCode').trim();
                const legalPersonName = formData.get('legalPersonName').trim();
                const contactPhone = formData.get('contactPhone').trim();

                // 表单验证
                if (!companyName || !socialCreditCode || !legalPersonName || !contactPhone) {
                    showMessage('请填写所有必填字段', true);
                    return;
                }

                // 验证统一社会信用代码格式
                if (!/^[0-9A-Z]{18}$/.test(socialCreditCode)) {
                    showMessage('统一社会信用代码格式不正确，应为18位数字或大写字母', true);
                    return;
                }

                // 验证手机号格式
                if (!/^1[3-9]\d{9}$/.test(contactPhone)) {
                    showMessage('请输入正确的手机号码', true);
                    return;
                }

                // 显示提交状态
                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';

                try {
                    // 获取选择的服务信息
                    const selectedService = localStorage.getItem('selectedService') || '年报申报';
                    const selectedPrice = parseInt(localStorage.getItem('selectedPrice')) || 130;

                    if (!supabaseClient) {
                        throw new Error('系统未初始化，请刷新页面重试');
                    }

                    // 提交企业信息到 Supabase
                    const { data, error } = await supabaseClient
                        .from('enterprise_submissions')
                        .insert([
                            {
                                company_name: companyName,
                                social_credit_code: socialCreditCode,
                                legal_person_name: legalPersonName,
                                contact_phone: contactPhone,
                                selected_service: selectedService,
                                selected_price: selectedPrice,
                                created_at: new Date().toISOString()
                            }
                        ])
                        .select();

                    if (error) {
                        throw error;
                    }

                    showMessage('企业信息提交成功！正在跳转支付...', false);

                    // 生成订单号（仅用于支付系统）
                    const orderId = 'ORD' + Date.now() + Math.random().toString(36).substr(2, 4).toUpperCase();

                    // 创建订单数据（仅保存到本地，供支付系统使用）
                    const orderData = {
                        orderId: orderId,
                        companyName: companyName,
                        socialCreditCode: socialCreditCode,
                        legalPersonName: legalPersonName,
                        contactPhone: contactPhone,
                        selectedService: selectedService,
                        selectedPrice: selectedPrice,
                        paymentStatus: 'pending',
                        paymentMethod: null,
                        createTime: new Date().toISOString(),
                        paymentTime: null
                    };

                    // 保存到本地存储（供支付系统使用）
                    localStorage.setItem('formData', JSON.stringify(orderData));
                    localStorage.setItem('currentOrderId', orderId);
                    localStorage.setItem(`order_${orderId}`, JSON.stringify(orderData));

                    // 延迟后跳转到支付页面
                    setTimeout(() => {
                        window.location.href = 'payment.html';
                    }, 1500);

                } catch (error) {
                    console.error('提交错误:', error);
                    showMessage('提交失败，请重试: ' + error.message, true);

                    // 恢复按钮状态
                    submitBtn.disabled = false;
                    submitBtn.textContent = '确认信息并支付';
                }
            };
            
            // 页面加载时检查是否有保存的数据
            window.addEventListener('DOMContentLoaded', function() {
                // 如果没有选择服务，默认设置为年报申报
                if (!localStorage.getItem('selectedService')) {
                    localStorage.setItem('selectedService', '年报申报');
                    localStorage.setItem('selectedPrice', '130');
                }
            });
        })();
    </script>
</body>
</html>
